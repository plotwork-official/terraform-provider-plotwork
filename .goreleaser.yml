# Builds, checksums and signs the provider in the layout the Terraform and
# OpenTofu registries read. From HashiCorp's provider scaffolding.
# https://goreleaser.com/customization/
version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env:
      # A static binary runs on HCP Terraform and in any CI image.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      # A pre-release (v0.2.0-beta.1) talks to the preview API by default; a stable release to production.
      - "-s -w -X main.version={{ .Version }} -X main.defaultAPIURL={{ if .Prerelease }}https://api-preview.plotwork.dev{{ else }}https://api.plotwork.dev{{ end }}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
# No sboms: here. GoReleaser lists every SBOM in the signed SHA256SUMS, and the Terraform Registry refuses a release
# whose checksums name files that are not provider archives. The release workflow writes the SBOMs after this runs and
# attaches them to the release beside the archives instead.
checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  # A tag with a pre-release suffix is marked as a pre-release on GitHub.
  prerelease: auto
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
changelog:
  disable: true
